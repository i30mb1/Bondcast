<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Bondcast captions</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  :root {
    --caption-size: 34px;
    --guest-color: #34c759;
    --caption-bg: rgba(0,0,0,0.6);
  }
  #captions {
    position: absolute; left: 40px; right: 40px; bottom: 40px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    font-family: "Inter", system-ui, sans-serif;
  }
  .line {
    max-width: 80vw; padding: 8px 16px; border-radius: 10px;
    background: var(--caption-bg); color: #fff;
    font-size: var(--caption-size); font-weight: 600; line-height: 1.2;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    transition: opacity 0.15s ease;
  }
  .name { margin-right: 10px; font-weight: 800; }
  .partial { opacity: 0.65; }
</style>
</head>
<body>
<div id="captions"></div>
<script>
  function queryParam(name) {
    var m = location.search.match(new RegExp("[?&]" + name + "=([^&]+)"));
    return m ? decodeURIComponent(m[1]) : null;
  }

  var WS_URL = queryParam("ws") || "ws://" + location.hostname + ":8765";
  var container = document.getElementById("captions");
  var activeSeq = null;
  var activeEl = null;
  var MAX_LINES = 3;

  // Оформление раньше кодировалось в query-параметрах этой же ссылки (?size=/
  // ?guestColor=/?bg=/?lines=) — каждую правку в панели приходилось заново
  // копировать в OBS Browser Source. Теперь панель хранит оформление сама и
  // отдаёт его публично (GET /api/captions/overlay-style, без логина — этой
  // странице неоткуда взять пароль панели) — эта ссылка больше НЕ меняется
  // никогда, поллинг просто подтягивает live-значения с фиксированным периодом,
  // тем же паттерном, что и остальная панель (5с).
  var STYLE_API = "http://" + location.hostname + ":8081/api/captions/overlay-style";
  var SHOW_SPEAKER = true;

  function hexToRgba(hex, alpha) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || "");
    if (!m) return null;
    var r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }

  function applyStyle(style) {
    var root = document.documentElement.style;
    var size = parseInt(style.size, 10);
    if (size > 0) root.setProperty("--caption-size", size + "px");
    if (style.guestColor) root.setProperty("--guest-color", style.guestColor);
    var bg = hexToRgba(style.bgColor, (Number(style.bgOpacity) || 0) / 100);
    if (bg) root.setProperty("--caption-bg", bg);
    MAX_LINES = Math.max(1, parseInt(style.lines, 10) || 3);
    SHOW_SPEAKER = style.showSpeaker !== false;
    trim();
  }

  function pollStyle() {
    fetch(STYLE_API)
      .then(function (r) { return r.json(); })
      .then(applyStyle)
      .catch(function () {}); // панель могла быть недоступна секунду — просто ждём следующего опроса
  }
  pollStyle();
  setInterval(pollStyle, 5000);

  // Палитра для именованных голосов — тот же приём детерминированного хеша,
  // что и pulseDelay() в panel/public/app.js (тоже десинхронизирует несколько
  // похожих анимаций/цветов по seed), продублирован здесь: у оверлея нет
  // общего бандла с панелью. speaker_id стабилен (voiceId с сервера), поэтому
  // один и тот же голос всегда красится одним и тем же цветом на этом экране.
  var VOICE_PALETTE = ["#ff3b30", "#0a84ff", "#ffd60a", "#bf5af2", "#30d158", "#ff9f0a"];
  function colorForId(id) {
    var hash = 0;
    for (var i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) >>> 0;
    return VOICE_PALETTE[hash % VOICE_PALETTE.length];
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fill(el, evt) {
    el.className = "line" + (evt.final ? "" : " partial");
    if (!SHOW_SPEAKER) {
      el.innerHTML = escapeHtml(evt.text);
      return;
    }
    var nameColor = evt.speaker_id === "guest" ? "var(--guest-color)" : colorForId(evt.speaker_id);
    el.innerHTML = '<span class="name" style="color:' + nameColor + '">' + escapeHtml(evt.speaker_name) + ':</span>' + escapeHtml(evt.text);
  }

  function trim() {
    while (container.children.length > MAX_LINES) {
      container.removeChild(container.firstChild);
    }
  }

  function render(evt) {
    if (activeEl !== null && activeSeq === evt.seq) {
      fill(activeEl, evt);
    } else {
      var el = document.createElement("div");
      fill(el, evt);
      container.appendChild(el);
      activeEl = el;
      activeSeq = evt.seq;
      trim();
    }
    if (evt.final) {
      activeEl = null;
      activeSeq = null;
    }
  }

  function connect() {
    var ws = new WebSocket(WS_URL);
    ws.onmessage = function (m) {
      try { render(JSON.parse(m.data)); } catch (e) {}
    };
    ws.onclose = function () { setTimeout(connect, 1500); };
  }
  connect();
</script>
</body>
</html>

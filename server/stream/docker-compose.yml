# Имя проекта закреплено явно - иначе Compose берёт его из имени папки
# (server/stream в репо -> "stream", %localappdata%\BondcastStream в
# установленной копии -> "bondcaststream"), и это два РАЗНЫХ проекта с
# независимыми стеками контейнеров. Для сервисов без container_name (overlay,
# asr-worker) это означает отдельный "<project>-overlay-1" на каждый проект -
# они конкурируют за порт 8082, и старый осиротевший контейнер остаётся висеть,
# когда переключаешься между запуском из репо и установленным ярлыком.
name: bondcast-stream

# Лимита на docker-логи не было вообще: json-file рос на диске неограниченно, а на
# долгом эфире это гигабайты. Собственный лог стека живёт отдельно, в ./logs (его
# пишет panel/logger.js) — этот блок страхует случай, когда панель не работает и
# собирать логи некому.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  bondcast-net:
    name: bondcast-net

services:
  srs:
    # r3, не r0: в r0 зашит libsrt 1.5.3 с удалённым переполнением стека (CVE-2026-55868 и
    # 55869), до которого дотягивается любой, кто установил SRT-соединение, — а порты 10080
    # и 5000 у стримера открыты в интернет. Исправлено в libsrt 1.5.6, он в SRS с 6.0.192.
    # Тот же тег стоит в SPECS в panel/server.js — менять вместе.
    image: ossrs/srs:v6.0-r3
    container_name: srs
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    restart: unless-stopped
    networks: [bondcast-net]
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8080:8080"
      - "10080:10080/udp"
    volumes:
      - ./srs/srs.conf:/usr/local/srs/conf/srs.conf
    logging: *logging

  srtla-rec:
    build: ./srtla-rec
    image: srtla-rec:latest
    container_name: srtla-rec
    entrypoint: ["srtla_rec"]
    command: ["5000", "srs", "10080"]
    restart: unless-stopped
    # srtla_rec не ловит SIGTERM, поэтому остановка ждала штатные 10 с до SIGKILL (замер:
    # перезапуск 10,5 с против 1,6 с). Сохранять ему при выходе нечего.
    stop_grace_period: 1s
    networks: [bondcast-net]
    ports:
      - "5000:5000/udp"
    # restart: true — srtla_rec узнаёт адрес "srs" один раз, при своём старте, и дальше шлёт
    # туда вслепую. Пересоздали SRS (новый образ, обновление) — он мог получить другой адрес
    # в сети, а бондинг молча уходил бы в пустоту до полного перезапуска. Так compose сам
    # перезапускает srtla-rec вслед за SRS. Перезапуск SRS рвёт эфир в любом случае, лишнего
    # обрыва это не добавляет. Запуск SRS мимо compose страхует panel/server.js.
    depends_on:
      srs:
        condition: service_started
        restart: true
    logging: *logging

  panel:
    build: ./panel
    image: stream-panel:latest
    container_name: stream-panel
    restart: unless-stopped
    networks: [bondcast-net]
    ports:
      - "8081:8081"
    environment:
      # Абсолютный путь к этой папке на хосте — нужен панели, чтобы монтировать
      # правильные bind-пути при пересоздании удалённых контейнеров. Задаётся start.bat.
      - PROJECT_ROOT=${PROJECT_ROOT}
      # Адрес(а), которые панель показывает для подключения — start.bat кладёт сюда
      # ПУБЛИЧНЫЙ адрес, если смог его узнать (телефон идёт через интернет), и только
      # при неудаче падает на LAN-адрес. Панель сама их не видит (сидит в Docker-сети).
      - HOST_IPS=${HOST_IPS}
      # Именно LAN-адрес(а) этой машины, всегда — отдельно от HOST_IPS выше. Нужен
      # диагностике закрытого порта: его вписывают в правило проброса на роутере, и по
      # нему же видно, что между машиной и интернетом есть NAT (см. /api/reachability).
      - LAN_IPS=${LAN_IPS}
      # Адрес роутера (шлюз) — панель даёт по нему прямую ссылку в веб-морду, где
      # пробрасывают порты. У всех он разный, поэтому берётся с хоста, а не угадывается.
      - GATEWAY_IPS=${GATEWAY_IPS}
      - PANEL_USER=
      - PANEL_PASS=
      # Токен для друзей, которым нужен только read-only доступ к статистике битрейта
      # (NOALBS ?token=...) — отдельно от PANEL_PASS, чтобы не давать им пароль от всей панели.
      - NOALBS_STATS_TOKEN=
      # Уровень лога панели. debug включают только на время отлова конкретного бага —
      # на нём в файл идут и подробности docker-подписок.
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Смещение местного времени хоста в минутах (считает start.bat). Внутри
      # Linux-контейнера часы всегда UTC, а лог читает человек по своим часам.
      - TZ_OFFSET_MIN=${TZ_OFFSET_MIN:-0}
    volumes:
      # Доступ к Docker Engine — стартовать/стопать/пересоздавать остальные сервисы.
      - /var/run/docker.sock:/var/run/docker.sock
      # Контекст сборки asr-worker — панель билдит образ сама (кнопка «Собрать» в дашборде),
      # ей нужен физический доступ к файлам, не только хостовый путь для Binds.
      - ./asr-obs:/build-context/asr-obs
      # Контекст сборки enhance-worker (улучшение картинки) — тот же приём, что у субтитров.
      - ./enhance:/build-context/enhance:ro
      # Версия установленной копии (пишет installer/setup.iss при установке/обновлении,
      # см. GET /api/update/status в server.js) — bind на файл, не env-переменная: после
      # тихого обновления (update.ps1) файл на диске меняется сразу, панель видит новую
      # версию на следующий опрос без пересоздания контейнера.
      - ./VERSION:/build-context/VERSION:ro
      # Логи всего стека. Папка лежит рядом со start.bat (у установленной копии —
      # %localappdata%\BondcastStream\logs), чтобы файл можно было просто взять и
      # переслать, не залезая в docker.
      - ./logs:/logs
    logging: *logging

  # Тяжёлый GPU-сервис (распознавание речи в субтитры) — НЕ поднимается на обычный
  # "docker compose up -d" (profiles), собирается лениво по кнопке в панели
  # (POST /api/captions/build), запускается/пересоздаётся под конкретный стрим через
  # POST /api/captions/connect. deploy.resources здесь — на случай прямого "docker compose
  # up asr-worker" в обход панели; сама панель транслирует это в HostConfig.DeviceRequests.
  asr-worker:
    build: ./asr-obs
    image: bondcast-asr-worker:latest
    container_name: asr-worker
    profiles: ["captions"]
    networks: [bondcast-net]
    ports:
      - "8765:8765"
    volumes:
      - ./asr-obs/config.yaml:/srv/config.yaml:ro
      - ./asr-obs/voices:/srv/voices:ro
      - hf-cache:/root/.cache/huggingface
      - gigaam-cache:/root/.cache/gigaam
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging: *logging

  # Улучшение картинки эфира на NVIDIA (VSR из Maxine VFX SDK) — как и субтитры, не
  # поднимается на обычный "up" (profiles), образ собирается по кнопке в панели
  # (POST /api/enhance/build), контейнер создаётся под конкретный стрим через
  # POST /api/enhance/connect. Этот блок — для прямого "docker compose up enhance-worker".
  enhance-worker:
    build: ./enhance
    image: bondcast-enhance:latest
    container_name: enhance-worker
    profiles: ["enhance"]
    networks: [bondcast-net]
    environment:
      - ENHANCE_SOURCE=${ENHANCE_SOURCE:-livestream}
      # all, а не дефолтные compute,utility: иначе в контейнер не попадёт
      # libnvidia-ngx, на котором работает VSR.
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging: *logging

  # Статичный оверлей субтитров для OBS Browser Source — лёгкий, всегда доступен.
  overlay:
    image: nginx:alpine
    container_name: overlay
    restart: unless-stopped
    networks: [bondcast-net]
    volumes:
      - ./asr-obs/overlay:/usr/share/nginx/html:ro
    ports:
      - "8082:80"
    logging: *logging

volumes:
  hf-cache:
  # GigaAM (в отличие от SpeechBrain/HF) кэширует свой чекпоинт (~420МБ) не через
  # huggingface_hub, а сам, в /root/.cache/gigaam — без отдельного volume эта папка
  # раньше не переживала пересоздание контейнера (recreate — на каждое подключение),
  # и модель качалась заново каждый раз. См. server.js's captionsSpec()/enrollSpec().
  gigaam-cache:

# Имя проекта закреплено явно - иначе Compose берёт его из имени папки
# (server/stream в репо -> "stream", %localappdata%\BondcastStream в
# установленной копии -> "bondcaststream"), и это два РАЗНЫХ проекта с
# независимыми стеками контейнеров. Для сервисов без container_name (overlay,
# asr-worker) это означает отдельный "<project>-overlay-1" на каждый проект -
# они конкурируют за порт 8082, и старый осиротевший контейнер остаётся висеть,
# когда переключаешься между запуском из репо и установленным ярлыком.
name: bondcast-stream

networks:
  bondcast-net:
    name: bondcast-net

services:
  srs:
    image: ossrs/srs:v6.0-r0
    container_name: srs
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    restart: unless-stopped
    networks: [bondcast-net]
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8080:8080"
      - "10080:10080/udp"
    volumes:
      - ./srs/srs.conf:/usr/local/srs/conf/srs.conf

  srtla-rec:
    build: ./srtla-rec
    image: srtla-rec:latest
    container_name: srtla-rec
    entrypoint: ["srtla_rec"]
    command: ["5000", "srs", "10080"]
    restart: unless-stopped
    networks: [bondcast-net]
    ports:
      - "5000:5000/udp"
    depends_on:
      - srs

  panel:
    build: ./panel
    image: stream-panel:latest
    container_name: stream-panel
    restart: unless-stopped
    networks: [bondcast-net]
    ports:
      - "8081:8081"
    environment:
      # Абсолютный путь к этой папке на хосте — нужен панели, чтобы монтировать
      # правильные bind-пути при пересоздании удалённых контейнеров. Задаётся start.bat.
      - PROJECT_ROOT=${PROJECT_ROOT}
      # LAN IP(-ы) этой машины — панель сама их не видит (сидит в Docker-сети),
      # поэтому start.bat вычисляет их снаружи (PowerShell) и передаёт сюда.
      - HOST_IPS=${HOST_IPS}
      - PANEL_USER=
      - PANEL_PASS=
      # Токен для друзей, которым нужен только read-only доступ к статистике битрейта
      # (NOALBS ?token=...) — отдельно от PANEL_PASS, чтобы не давать им пароль от всей панели.
      - NOALBS_STATS_TOKEN=
    volumes:
      # Доступ к Docker Engine — стартовать/стопать/пересоздавать остальные сервисы.
      - /var/run/docker.sock:/var/run/docker.sock
      # Контекст сборки asr-worker — панель билдит образ сама (кнопка «Собрать» в дашборде),
      # ей нужен физический доступ к файлам, не только хостовый путь для Binds. Без :ro —
      # сюда же панель пишет host_name.txt (после энроллмента, см. /api/captions/enroll).
      - ./asr-obs:/build-context/asr-obs

  # Тяжёлый GPU-сервис (распознавание речи в субтитры) — НЕ поднимается на обычный
  # "docker compose up -d" (profiles), собирается лениво по кнопке в панели
  # (POST /api/captions/build), запускается/пересоздаётся под конкретный стрим через
  # POST /api/captions/connect. deploy.resources здесь — на случай прямого "docker compose
  # up asr-worker" в обход панели; сама панель транслирует это в HostConfig.DeviceRequests.
  asr-worker:
    build: ./asr-obs
    image: bondcast-asr-worker:latest
    container_name: asr-worker
    profiles: ["captions"]
    networks: [bondcast-net]
    ports:
      - "8765:8765"
    volumes:
      - ./asr-obs/config.yaml:/srv/config.yaml:ro
      - ./asr-obs/voices:/srv/voices:ro
      - hf-cache:/root/.cache/huggingface
      - gigaam-cache:/root/.cache/gigaam
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Статичный оверлей субтитров для OBS Browser Source — лёгкий, всегда доступен.
  overlay:
    image: nginx:alpine
    container_name: overlay
    restart: unless-stopped
    networks: [bondcast-net]
    volumes:
      - ./asr-obs/overlay:/usr/share/nginx/html:ro
    ports:
      - "8082:80"

volumes:
  hf-cache:
  # GigaAM (в отличие от SpeechBrain/HF) кэширует свой чекпоинт (~420МБ) не через
  # huggingface_hub, а сам, в /root/.cache/gigaam — без отдельного volume эта папка
  # раньше не переживала пересоздание контейнера (recreate — на каждое подключение),
  # и модель качалась заново каждый раз. См. server.js's captionsSpec()/enrollSpec().
  gigaam-cache:

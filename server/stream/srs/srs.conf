# Основные настройки сервера
listen              1935;
max_connections     20;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# Настройки SRT сервера (Прием потока с камеры)
srt_server {
    enabled         on;
    listen          10080;

    # Синхронизация задержки с камерой
    latency         500;

    # Плавность: отдает пакеты в OBS равномерно, убирая рывки
    tsbpdmode       on;

    # Защита: сбрасывает слишком старые пакеты, не давая задержке расти
    tlpktdrop       on;

    # Увеличенные буферы для работы с HEVC/1080p60
    sendbuf         16777216;
    recvbuf         16777216;

    # Без жесткого лимита: реальный битрейт ограничивай на камере.
    # Лимит на приемнике резал бы и ретрансмиссии -> дропы при потерях.
    maxbw           1000000000;
    payloadsize     1316;

    connect_timeout 4000;
    peer_idle_timeout 8000;
}

# Виртуальный хост (Конвертация SRT -> RTMP + выдача в браузер)
vhost __defaultVhost__ {
    srt {
        enabled     on;
        srt_to_rtmp on;
    }

    # Низкая задержка на отдаче (профиль из conf/realtime.conf самого SRS).
    # По умолчанию SRS копит кадры и пишет зрителю пачками по 350 мс (mw_latency):
    # для VOD это экономит системные вызовы, но живой поток от этого идёт рывками —
    # плеер то голодает, то давится пачкой. Отдаём сразу, как пришло.
    tcp_nodelay     on;
    min_latency     on;

    play {
        # Кэш последнего GOP оставляем ВКЛЮЧЁННЫМ (дефолт SRS), хотя профиль
        # realtime.conf его гасит. Он стоит на пути реального эфира: если OBS
        # переподключится к источнику посреди трансляции, без кэша зрители увидят
        # чёрный экран до ближайшего ключевого кадра (здесь 1-2 с). Ради более
        # свежего предпросмотра так рисковать нечем: догонять живой край плеер в
        # панели теперь умеет сам (jumpToLive в panel/public/app.js).
        gop_cache       on;
        queue_length    10;
        mw_latency      100;
    }

    # HLS: ссылка http://localhost:8080/live/<stream>.m3u8
    # Универсально (VLC, Safari, hls.js), но задержка +5-10 сек.
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      10;
    }

    # HTTP-FLV: ссылка http://localhost:8080/live/<stream>.flv
    # Низкая задержка, но в браузере нужен flv.js (или открыть в VLC).
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
}
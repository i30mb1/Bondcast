# Основные настройки сервера
listen              1935;
max_connections     20;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# Настройки SRT сервера (Прием потока с камеры)
srt_server {
    enabled         on;
    listen          10080;

    # Задержка SRT разделена по направлениям (общий latency задал бы оба сразу).
    #
    # recvlatency — приём с телефона. Это ПОЛ: реально работает max(наш, запрошенный камерой),
    # то есть камера со своими 1000 мс получит 1000. Пол нужен для чужих энкодеров, которые
    # просят слишком мало и потом сыплют артефактами на первой же потере.
    #
    # peerlatency — отдача в OBS, здесь сервер выступает отправителем. Прежние 500 мс просто
    # добавлялись к задержке эфира: OBS и сервер всегда на одной машине, RTT ~0, ретрансмиссия
    # укладывается в единицы миллисекунд. 120 — дефолт libsrt, ниже смысла нет.
    recvlatency     500;
    peerlatency     120;

    # Плавность: отдает пакеты в OBS равномерно, убирая рывки
    tsbpdmode       on;

    # Защита: сбрасывает слишком старые пакеты, не давая задержке расти
    tlpktdrop       on;

    # Увеличенные буферы для работы с HEVC/1080p60
    sendbuf         16777216;
    recvbuf         16777216;

    # Без жесткого лимита: реальный битрейт ограничивай на камере.
    # Лимит на приемнике резал бы и ретрансмиссии -> дропы при потерях.
    maxbw           1000000000;
    payloadsize     1316;

    connect_timeout 4000;
    peer_idle_timeout 8000;
}

# Виртуальный хост (Конвертация SRT -> RTMP + выдача в браузер)
vhost __defaultVhost__ {
    srt {
        enabled     on;
        srt_to_rtmp on;
    }

    # Низкая задержка на отдаче (профиль из conf/realtime.conf самого SRS).
    # По умолчанию SRS копит кадры и пишет зрителю пачками по 350 мс (mw_latency):
    # для VOD это экономит системные вызовы, но живой поток от этого идёт рывками —
    # плеер то голодает, то давится пачкой. Отдаём сразу, как пришло.
    tcp_nodelay     on;
    min_latency     on;

    play {
        # Кэш последнего GOP оставляем ВКЛЮЧЁННЫМ (дефолт SRS), хотя профиль
        # realtime.conf его гасит. Он стоит на пути реального эфира: если OBS
        # переподключится к источнику посреди трансляции, без кэша зрители увидят
        # чёрный экран до ближайшего ключевого кадра (здесь 1-2 с). Ради более
        # свежего предпросмотра так рисковать нечем: догонять живой край плеер в
        # панели теперь умеет сам (jumpToLive в panel/public/app.js).
        gop_cache       on;
        # ...но глубину кэша ограничиваем (дефолт SRS — 2500 кадров). Отставание, с которым
        # потребитель подключился, остаётся у него НАВСЕГДА: замер на живом стеке показал
        # стабильные 3-4 с у приёмника, вошедшего на выбросе кэша. 48 кадров — это ровно один
        # GOP (2 с при 24 к/с, дефолт камеры; на 60 к/с кэш просто окажется короче GOP):
        # чёрного экрана при переподключении OBS по-прежнему не будет, а лишний хвост в буфер
        # зрителя не улетит.
        gop_cache_max_frames 48;
        queue_length    10;
        # 0 вместо 100: при min_latency on это штатный realtime-профиль SRS — отдаём сообщение
        # сразу, не собирая пачку. Прежние 100 мс были чистой добавкой к задержке.
        mw_latency      0;
    }

    # HLS: ссылка http://localhost:8080/live/<stream>.m3u8
    # Универсально (VLC, Safari, hls.js), но задержка +5-10 сек.
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      10;
    }

    # HTTP-FLV: ссылка http://localhost:8080/live/<stream>.flv
    # Низкая задержка, но в браузере нужен flv.js (или открыть в VLC).
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
}
# Основные настройки сервера
listen              1935;
max_connections     20;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# Настройки SRT сервера (Прием потока с камеры)
srt_server {
    enabled         on;
    listen          10080;

    # Задержка SRT разделена по направлениям (общий latency задал бы оба сразу).
    #
    # recvlatency — приём с телефона. Это ПОЛ: реально работает max(наш, запрошенный камерой),
    # то есть камера со своими 1000 мс получит 1000. Пол нужен для чужих энкодеров, которые
    # просят слишком мало и потом сыплют артефактами на первой же потере.
    #
    # 1500 вместо прежних 500: полторы секунды — это 5-7 попыток повтора на сотовом RTT
    # 150-250 мс, в 500 мс укладывалась одна-две. Цена: эфир от камеры, которая просит меньше
    # 1500, станет позже на разницу (Bondcast по умолчанию просит 1000 — ему это +0,5 с), а
    # ползунок задержки в приложении ниже 1500 перестаёт что-либо менять.
    #
    # Перегруженный канал это не лечит. Проверено на том самом эфире 13.11, ради которого буфер
    # и подняли: и на 500, и на 1500 картина одна — 77-86% пакетов не доходят с первой попытки,
    # 10-17% выбрасываются (RCV-DROPPED). Там поток 5,0-5,5 Мбит/с упирался в потолок около
    # 5,1 Мбит/с где-то по дороге, а кодер в ответ заливал канал повторами. Такое лечится только
    # битрейтом на отправителе; признак в логе — pktRecv стоит на одном числе, а pktRcvRetrans
    # составляет от него 70% и больше.
    #
    # peerlatency — отдача в OBS, здесь сервер выступает отправителем. Прежние 500 мс просто
    # добавлялись к задержке эфира: OBS и сервер всегда на одной машине, RTT ~0, ретрансмиссия
    # укладывается в единицы миллисекунд. 120 — дефолт libsrt, ниже смысла нет.
    recvlatency     1500;
    peerlatency     120;

    # Плавность: отдает пакеты в OBS равномерно, убирая рывки
    tsbpdmode       on;

    # Защита: сбрасывает слишком старые пакеты, не давая задержке расти
    tlpktdrop       on;

    # Увеличенные буферы для работы с HEVC/1080p60
    sendbuf         16777216;
    recvbuf         16777216;

    # Без жесткого лимита: реальный битрейт ограничивай на камере.
    # Лимит на приемнике резал бы и ретрансмиссии -> дропы при потерях.
    maxbw           1000000000;
    payloadsize     1316;

    connect_timeout 4000;
    # SRS 6 закрывает публикацию через 5 с без данных, что бы здесь ни стояло: таймаут чтения
    # зашит в коде (ossrs/srs#4600, исправлено только в 7.0.134). Прежние 8000 поэтому ничего
    # не меняли. Пишем как есть — и поведение не поедет, когда дойдём до SRS 7.
    peer_idle_timeout 5000;
}

# Виртуальный хост (Конвертация SRT -> RTMP + выдача в браузер)
vhost __defaultVhost__ {
    srt {
        enabled     on;
        srt_to_rtmp on;
    }

    # Низкая задержка на отдаче (профиль из conf/realtime.conf самого SRS).
    # По умолчанию SRS копит кадры и пишет зрителю пачками по 350 мс (mw_latency):
    # для VOD это экономит системные вызовы, но живой поток от этого идёт рывками —
    # плеер то голодает, то давится пачкой. Отдаём сразу, как пришло.
    tcp_nodelay     on;
    min_latency     on;

    play {
        # Кэш последнего GOP оставляем ВКЛЮЧЁННЫМ (дефолт SRS), хотя профиль
        # realtime.conf его гасит. Он стоит на пути реального эфира: если OBS
        # переподключится к источнику посреди трансляции, без кэша зрители увидят
        # чёрный экран до ближайшего ключевого кадра (здесь 1-2 с). Ради более
        # свежего предпросмотра так рисковать нечем: догонять живой край плеер в
        # панели теперь умеет сам (jumpToLive в panel/public/app.js).
        gop_cache       on;
        # ...но глубину кэша ограничиваем (дефолт SRS — 2500). Отставание, с которым
        # потребитель подключился, остаётся у него НАВСЕГДА: замер на живом стеке показал
        # стабильные 3-4 с у приёмника, вошедшего на выбросе кэша. Цель — ровно один GOP:
        # чёрного экрана при переподключении OBS не будет, а лишний хвост в буфер зрителя
        # не улетит.
        #
        # Лимит считает ВСЕ сообщения, а не видеокадры: звук идёт туда же (AAC — 43-47
        # сообщений в секунду). И при переполнении SRS не сдвигает окно, а стирает кэш целиком
        # и копит дальше с середины GOP — зритель получает поток без ключевого кадра. Прежние
        # 48 поэтому кончались через 0,7 с после ключевого кадра, и кэш стирался дважды за GOP:
        # в проверке 6 зрителей из 6 начали не с ключевого кадра.
        #
        # Считать так: секунды GOP x (к/с видео + 47). У Bondcast GOP 2 с: 24 к/с — 142,
        # 60 к/с — 214. 250 покрывает оба. Чужой кодер с GOP длиннее (OBS по умолчанию — до
        # 8 с) лимит по-прежнему переполнит и получит то же, что без кэша: ждать ключевой кадр,
        # зато без многосекундного отставания.
        gop_cache_max_frames 250;
        queue_length    10;
        # 10, а не 0. Ноль — штатный realtime-профиль SRS, но в SRS 6 цикл зрителя по HTTP-FLV
        # при пустой очереди делает sleep(mw_latency), и с нулём крутится вхолостую: любой
        # FLV-зритель (OBS по ссылке из панели, превью) держит ядро на 100%, даже когда эфира
        # нет. Замер: 0,35% без зрителя, 100% со зрителем; с 10 мс — 0,5-2%. Цена — до 10 мс
        # задержки. Прежние 100 мс были чистой добавкой.
        mw_latency      10;
    }

    # HLS: ссылка http://localhost:8080/live/<stream>.m3u8
    # Универсально (VLC, Safari, hls.js), но задержка +5-10 сек.
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      10;
    }

    # HTTP-FLV: ссылка http://localhost:8080/live/<stream>.flv
    # Низкая задержка, но в браузере нужен flv.js (или открыть в VLC).
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
}
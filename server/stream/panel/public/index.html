<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bondcast — быстрый старт</title>
<style>
  /* Палитра и типографика — 1:1 с core/ui/Theme.kt и street/StreetType.kt мобильного приложения */
  :root {
    --bg: #0e0e0e; --elevated: #232323; --input-bg: #161616; --divider: #2a2a2a;
    --text: #eeeeee; --muted: #666666;
    --green: #2fbf5b; --accent: #ff3c3c; --accent-pressed: #d42f2f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    padding: 24px; max-width: 480px; margin: 0 auto;
  }
  h1 {
    font-size: 22px; margin: 24px 0 4px;
    font-style: italic; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase;
  }
  p.lead { color: var(--muted); font-size: 14px; margin: 0 0 24px; }

  .step { display: flex; gap: 14px; margin-bottom: 16px; }
  .step-num {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
    background: var(--elevated); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; font-style: italic;
  }
  .step-body {
    flex: 1; background: var(--bg); border: 1px solid var(--divider);
    border-radius: 8px; padding: 14px 16px;
  }
  .step-body h2 {
    font-size: 13px; margin: 0 0 10px; color: var(--accent);
    font-style: italic; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
  }

  .status { font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.bad { background: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.5; }

  .name-row { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type=text] {
    background: var(--input-bg); border: 1px solid transparent; color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 13px; width: 100%;
  }
  .name-row input[type=text] { margin-bottom: 0; }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  button.dice-btn {
    flex-shrink: 0; background: var(--elevated); border: none; border-radius: 8px;
    font-size: 16px; padding: 0 14px; cursor: pointer; line-height: 1;
  }
  button.dice-btn:hover { background: #2c2c2c; }
  img#qr { display: block; margin: 4px auto; border-radius: 8px; width: 220px; height: 220px; background: #fff; }

  a.advanced-link {
    display: block; text-align: center; color: var(--muted); font-size: 13px;
    text-decoration: none; margin-top: 20px; padding-bottom: 20px;
  }
  a.advanced-link:hover { color: var(--text); }
</style>
</head>
<body>
  <h1>Bondcast</h1>
  <p class="lead">3 шага — и телефон готов стримить на этот комп.</p>

  <div class="step">
    <div class="step-num">1</div>
    <div class="step-body">
      <h2>Сервисы запущены</h2>
      <div class="status" id="dockerStatus"><span class="dot"></span>проверяю…</div>
    </div>
  </div>

  <div class="step">
    <div class="step-num">2</div>
    <div class="step-body">
      <h2>Порт виден снаружи</h2>
      <div class="status" id="portStatus"><span class="dot"></span>проверяю…</div>
      <div class="hint" id="portHint"></div>
    </div>
  </div>

  <div class="step">
    <div class="step-num">3</div>
    <div class="step-body">
      <h2>Отсканируй в приложении</h2>
      <div class="name-row">
        <input type="text" id="streamName" placeholder="имя стрима" />
        <button type="button" class="dice-btn" id="regenName" title="Сгенерировать другое имя">🎲</button>
      </div>
      <img id="qr" alt="QR для подключения" />
      <div class="hint">Приложение → экран первого запуска → «📷 Сканировать QR».</div>
    </div>
  </div>

  <a class="advanced-link" href="dashboard.html">Расширенная панель (логи, статистика) →</a>

  <script src="setup.js"></script>
</body>
</html>
